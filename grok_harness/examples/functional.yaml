name: functional
# Functional output testing: does the model say the right thing?
# Use this as a starting template when you want to check that a prompt
# produces an expected substring, pattern, or exact value.
cases:
  - id: factual-recall
    description: Single-fact question, expected token must appear.
    tags: [functional]
    temperature: 0.0
    max_tokens: 64
    messages:
      - role: user
        content: What is the capital of France? Reply with just the city name.
    assertions:
      - kind: contains
        value: Paris
      - kind: max_tokens
        value: 8

  - id: case-insensitive-pattern
    description: Accept any casing/punctuation around the expected token.
    tags: [functional]
    temperature: 0.0
    max_tokens: 64
    messages:
      - role: user
        content: Confirm yes or no — is water wet?
    assertions:
      - kind: regex
        value: "(?i)\\byes\\b"

  - id: exact-equality
    description: Single-token response, exact match against a system-pinned answer.
    tags: [functional, strict]
    temperature: 0.0
    max_tokens: 4
    messages:
      - role: system
        content: Respond with the single word "OK" and nothing else.
      - role: user
        content: ack
    assertions:
      - kind: equals
        value: OK
